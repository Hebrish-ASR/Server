[project]
name = "hebrish-server"
version = "0.1.0"
description = "Hebrish inference server: web UI and HTTP API for Hebrish models (Sabich by default), paragraphs and clean-up"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "sherpa-onnx>=1.12",
]

[project.optional-dependencies]
# GPU engine. Install torch from the PyTorch index for your hardware first (docker/Dockerfile.torch).
nemo = ["nemo_toolkit[asr]==2.7.3", "huggingface_hub>=0.25"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hebrish_server", "hebrish_server.engines"]

[tool.setuptools.package-data]
hebrish_server = ["static/*"]
